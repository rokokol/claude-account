name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Called by update-lock.yml against its temp branch, so the lock bump is checked by this
  # file rather than by a copy of its commands
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@v31
      - name: VERSION matches CHANGELOG
        run: |
          ver=$(cat VERSION)
          grep -qF "## [$ver]" CHANGELOG.md || {
            echo "VERSION says $ver but CHANGELOG.md has no ## [$ver] heading" >&2
            exit 1
          }
      - run: nix build --no-write-lock-file .#claude-account
      # tests, package-smoke, package-settings, module-wiring, scripts-lint
      - run: nix flake check --no-write-lock-file
      # The script must stay usable without Nix: install.sh puts it behind a symlink,
      # and the suite has to pass against the installed copy
      - name: install.sh works
        run: |
          PREFIX=$PWD/out ./install.sh
          test -L out/bin/claude-account
          test -f out/share/bash-completion/completions/claude-account
          test -f out/share/zsh/site-functions/_claude-account
          test -f out/share/claude-account/install-manifest
          out/bin/claude-account --version | grep -xF "claude-account $(cat VERSION)"
          CLAUDE_ACCOUNT=$PWD/out/bin/claude-account ./tests/run.sh
          # Uninstall consumes the manifest and leaves nothing of ours behind
          PREFIX=$PWD/out ./install.sh --uninstall
          test ! -e out/bin/claude-account
          test ! -e out/share/claude-account
          DESTDIR=$PWD/stage PREFIX=/usr ./install.sh
          test -L stage/usr/bin/claude-account
          stage/usr/bin/claude-account --help >/dev/null
          DESTDIR=$PWD/stage PREFIX=/usr ./install.sh --uninstall
          test ! -e stage/usr/share/claude-account
          ! DESTDIR=$PWD/bad PREFIX=usr ./install.sh >/dev/null 2>&1
      - run: nix fmt -- --ci

  # The one file list lives in the flake's scripts-lint check — this job is a fast,
  # separately-named status for it, not a second copy of the commands
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@v31
      - run: nix build --no-write-lock-file .#checks.x86_64-linux.scripts-lint
